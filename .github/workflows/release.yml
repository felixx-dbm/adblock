name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update-lists
      - run: npm run build
      - run: cd dist && zip -qr "../adblock-${GITHUB_REF_NAME}.zip" .
      - run: gh release create "$GITHUB_REF_NAME" "adblock-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
